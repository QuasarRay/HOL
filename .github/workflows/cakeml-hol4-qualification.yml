      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cakeml-hol4-qualification
          if-no-files-found: warn
          path: |
            /tmp/hol4-cakeml-inventory.json
            /tmp/egglog-receipt.json
            /tmp/cakeml-compat.json
            /tmp/hol4-cakeml-proof/
