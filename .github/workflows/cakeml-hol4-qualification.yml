name: cakeml-hol4-qualification

on:
  workflow_dispatch:
    inputs:
      target:
        description: Qualification scope
        type: choice
        default: report-witnesses
        options:
          - report-witnesses
          - compiler
# Full regeneration is expensive; source checkpoints do not trigger it.

jobs:
  report-witnesses:
    if: inputs.target == 'report-witnesses'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      HOLDIR: ${{ github.workspace }}
      CAKEMLDIR: /tmp/cakeml-report
      SML97DIR: /tmp/sml97
      HOL4_TACTICTOE_CACHE: /tmp/tactictoe-reused
      HOL4_Z3_EXECUTABLE: /usr/bin/z3
      HOL4_EGGLOG_PYTHON: /tmp/egglog-python/bin/python
      HOL4_GAP_OUT_BASE: /tmp/gap-evidence
    steps:
      - name: Checkout proof sources
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install and record host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y polyml libpolyml-dev z3 build-essential python3-venv ripgrep
          mkdir -p /tmp/gap-evidence
          dpkg-query -W polyml libpolyml-dev z3 > /tmp/gap-evidence/host-tools.log
          python3 -m venv /tmp/egglog-python
          /tmp/egglog-python/bin/pip install egglog==14.0.0

      - name: Fetch immutable source and search-data pins
        run: |
          git fetch https://github.com/HOL-Theorem-Prover/HOL.git 652d1f0aad5cd537ed1e5d470ba3444e70ba470e
          git clone --no-checkout https://github.com/CakeML/cakeml.git "$CAKEMLDIR"
          git -C "$CAKEMLDIR" checkout --detach f8da03aeecd4d58a35bb88286780ff7e7e4ca7d6
          git clone --no-checkout https://github.com/SMLFamily/The-Definition-of-Standard-ML-Revised.git "$SML97DIR"
          git -C "$SML97DIR" checkout --detach c4212f434cafd06669171619f7d332341a5b31f3
          git init /tmp/metarocq-source
          git -C /tmp/metarocq-source fetch --depth=1 https://github.com/QuasarRay/MetaRocq-rs.git 12b4c993942010862cecebb3faa928b7b80ff9a8
          python3 tools/cakeml-hol4/restore_tactictoe_cache.py \
            --metarocq-source /tmp/metarocq-source --output "$HOL4_TACTICTOE_CACHE"

      - name: Build development HOL4 checker and selected prerequisites
        run: |
          polymain="$(dpkg -L libpolyml-dev | rg '/libpolymain\.a$' | head -n1)"
          test -n "$polymain"
          printf 'val polymllibdir = "%s";\n' "$(dirname "$polymain")" > tools-poly/poly-includes.ML
          poly < tools/smart-configure.sml
          bin/build -j2 -t0 --no-helpdocs --seq=tools/sequences/upto-parallel
          for dependency in 'floating-point machine_ieeeTheory.uo' 'integer integer_wordTheory.uo' 'sort mergesortTheory.uo'; do
            read -r directory theory <<< "$dependency"
            (cd "$HOLDIR/src/$directory"; "$HOLDIR/bin/Holmake" -j2 "$theory"; "$HOLDIR/bin/linkToSigobj")
          done
          (cd "$CAKEMLDIR/misc"; "$HOLDIR/bin/Holmake" -j2 cakeml-heap)
          (cd "$CAKEMLDIR/basis/pure"; "$HOLDIR/bin/Holmake" -j2 mlstringTheory.uo)

      - name: Check regressions and reconstruct scoped proofs
        run: |
          python3 -m unittest discover -s tools/cakeml-hol4 -p 'test_*.py' -v
          tools/cakeml-hol4/qualify_gap_report.sh

      - name: Preserve report qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hol4-sml-scoped-report-witnesses
          path: |
            /tmp/gap-evidence/
            /tmp/tactictoe-reused/reuse-receipt.json
          if-no-files-found: error

  qualify:
    if: inputs.target == 'compiler'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout HOL4 branch
        uses: actions/checkout@v5

      - name: Install host prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y polyml libpolyml-dev z3 build-essential python3 ripgrep

      - name: Build ordinary HOL4 acceptance environment
        run: |
          polymain="$(dpkg -L libpolyml-dev | rg '/libpolymain\.a$' | head -n1)"
          test -n "$polymain"
          mkdir -p tools-poly
          printf 'val polymllibdir = "%s";\n' "$(dirname "$polymain")" \
            > tools-poly/poly-includes.ML
          poly < tools/smart-configure.sml
          bin/build -t --seq=tools/sequences/upto-parallel

      - name: Inventory core HOL4 SML before translation
        run: |
          python3 tools/cakeml-hol4/inventory.py \
            --root . --out /tmp/hol4-cakeml-inventory.json \
            src/portableML src/0 src/1 src/thm

      - name: Check frontend and evidence rejection boundaries
        run: |
          python3 -m unittest discover -s tools/cakeml-hol4 -p 'test_*.py' -v

      - name: Build pinned Egglog and bridge
        run: |
          git clone https://github.com/egraphs-good/egglog.git /tmp/egglog
          git -C /tmp/egglog checkout --detach 4821547da08c1a8e5a2f530625f1648f13b058a3
          cargo build --release --manifest-path /tmp/egglog/Cargo.toml
          cargo check --manifest-path tools/cakeml-hol4/egglog-bridge/Cargo.toml

      - name: Smoke Egglog candidate generation
        run: |
          printf '%s\t%s\t%s\n' \
            'boolTheory.BOOL_EQ_REFL' '(App (Const "f") (Const "a"))' '(Const "b")' \
            > /tmp/rules.tsv
          cargo run --quiet --manifest-path tools/cakeml-hol4/egglog-bridge/Cargo.toml -- \
            --egglog /tmp/egglog/target/release/egglog \
            --rules /tmp/rules.tsv \
            --lhs '(App (Const "f") (Const "a"))' --rhs '(Const "b")' \
            --out /tmp/candidate.rewrites --receipt /tmp/egglog-receipt.json

      - name: Fetch pinned CakeML once
        run: |
          git clone https://github.com/CakeML/cakeml.git /tmp/cakeml-source
          git -C /tmp/cakeml-source checkout --detach c98da7fc904c5d6d0e9a75a18fac1796a9bfb1f9

      - name: Materialize reused MetaRocq CakeML compatibility recipe
        run: |
          python3 tools/cakeml-hol4/materialize_cakeml_context_compat.py \
            --source /tmp/cakeml-source --output /tmp/cakeml-compat \
            --receipt /tmp/cakeml-compat.json

      - name: Build CakeML in-logic x64 compile library
        env:
          HOLDIR: ${{ github.workspace }}
          CAKEMLDIR: /tmp/cakeml-compat
        run: |
          cd /tmp/cakeml-compat/cv_translator
          "$HOLDIR/bin/Holmake" -j2 eval_cake_compile_x64Lib.uo

      - name: Compile proof-search replay library against real HOL4
        env:
          HOLDIR: ${{ github.workspace }}
          CAKEMLDIR: /tmp/cakeml-compat
        run: |
          cd tools/cakeml-hol4/formal
          "$HOLDIR/bin/Holmake" --qof --no-cache Hol4ProofSearchLib.uo

      - name: Check normalized macro theorems
        env:
          HOLDIR: ${{ github.workspace }}
          CAKEMLDIR: /tmp/cakeml-compat
        run: |
          cd tools/cakeml-hol4/formal
          "$HOLDIR/bin/Holmake" --qof --no-cache Hol4SmlMacroTheory.uo

      - name: Compile normalized CakeML matching fixture
        env:
          HOLDIR: ${{ github.workspace }}
          CAKEMLDIR: /tmp/cakeml-compat
          HOL4_CAKEML_OUT: /tmp/hol4-cakeml-proof
        run: |
          tools/cakeml-hol4/cakeml-hol4 build \
            tools/cakeml-hol4/fixtures/match.cml

      - name: Verify proof artifact digests
        run: |
          cd /tmp/hol4-cakeml-proof/proof
          sha256sum -c SHA256SUMS

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cakeml-hol4-qualification
          if-no-files-found: warn
          path: |
            /tmp/hol4-cakeml-inventory.json
            /tmp/egglog-receipt.json
            /tmp/cakeml-compat.json
            /tmp/hol4-cakeml-proof/
